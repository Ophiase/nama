name: release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: extractions/setup-just@v3
      - run: npm ci
      - run: just build
      - run: just notes "$GITHUB_REF_NAME" > notes.md
      - run: >
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME"
          --notes-file notes.md dist/main.js manifest.json
        env:
          GH_TOKEN: ${{ github.token }}
